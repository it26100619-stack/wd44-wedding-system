<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><title>Admin - Everlove</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}"><meta name="theme-color" content="#9d3d55"></head><body>
<div class="bar"><img th:src="@{/images/logo.png}" alt="Everlove"><span>Admin &nbsp; <a th:href="@{/admin/logout}">Log out</a></span></div>
<main class="dash">
  <div class="ok" th:if="${msg}" th:text="${msg}"></div><div class="error" th:if="${error}" th:text="${error}"></div>
  <p class="stats"><b th:text="${#lists.size(vendors)}"></b> vendors &nbsp; <b th:text="${customerCount}"></b> couples &nbsp; <b th:text="${#lists.size(bookings)}"></b> bookings</p>
  <h2>Add a vendor</h2>
  <form class="card" th:action="@{/admin/vendor}" method="post">
    <div class="row">
      <div><label>Business name</label><input name="name" required></div>
      <div><label>Category</label><select name="category"><option>Photographer</option><option>Caterer</option><option>Florist</option><option>Venue</option><option>DJ</option><option>Decorator</option></select></div>
      <div><label>City</label><input name="city" required></div>
      <div><label>Starting price (LKR)</label><input type="number" name="price" min="0" required></div>
      <div><label>Pricing</label><select name="unit"><option>Flat rate</option><option>Per guest</option></select></div>
    </div>
    <div class="row">
      <div><label>Login email</label><input type="email" name="email" required></div>
      <div><label>Login password</label><input type="password" name="password" required minlength="4"></div>
      <div><label>Phone</label><input name="phone" required></div>
    </div>
    <label>Description</label><textarea name="description" rows="2" required></textarea>
    <button class="btn" style="margin-top:1rem" type="submit">Add vendor</button>
  </form>
  <h2>All vendors</h2>
  <table><tr><th>Name</th><th>Category</th><th>City</th><th>Price</th><th>Email</th><th>Rating</th><th></th></tr>
    <tr th:each="v : ${vendors}"><td th:text="${v.name}"></td><td th:text="${v.category}"></td><td th:text="${v.city}"></td>
      <td th:text="'LKR ' + ${v.price} + ' ' + ${v.unit}"></td><td th:text="${v.email}"></td>
      <td th:text="${v.reviewCount > 0} ? ${#numbers.formatDecimal(v.rating,1,1)} + ' (' + ${v.reviewCount} + ')' : '-'"></td>
      <td><form th:action="@{/admin/vendor/{id}/delete(id=${v.id})}" method="post" onsubmit="return confirm('Delete this vendor?')"><button class="btn small danger" type="submit">Delete</button></form></td></tr>
    <tr th:if="${#lists.isEmpty(vendors)}"><td colspan="7" class="muted">No vendors yet. Add the first one above.</td></tr></table>
  <h2>All bookings</h2>
  <table><tr><th>Ref</th><th>Couple</th><th>Vendor</th><th>Date</th><th>Guests</th><th>Total (LKR)</th><th>Status</th></tr>
    <tr th:each="b : ${bookings}"><td th:text="'#' + ${b.id}"></td><td th:text="${b.customerName}"></td><td th:text="${b.vendorName}"></td><td th:text="${b.date}"></td><td th:text="${b.guests}"></td><td th:text="${b.total}"></td><td><span class="badge" th:classappend="${b.status}" th:text="${b.status}"></span></td></tr>
    <tr th:if="${#lists.isEmpty(bookings)}"><td colspan="7" class="muted">No bookings yet.</td></tr></table>
</main></body></html>
