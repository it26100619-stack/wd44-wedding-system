<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><title>My profile - Everlove</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}"><meta name="theme-color" content="#9d3d55"></head><body>
<div th:replace="~{fragments :: nav('profile')}"></div>
<section class="pagehead"><div class="wrap"><div class="eyebrow">ACCOUNT</div><h1>Edit your profile</h1></div></section>
<div class="wrap"><div class="ok" th:if="${param.saved}">Profile updated.</div>
<div class="split"><form class="panel" th:action="@{/customer/profile}" method="post" style="max-width:560px">
  <label>Name</label><input name="name" th:value="${customer.name}" required>
  <label>Email (cannot be changed)</label><input th:value="${customer.email}" readonly>
  <label>Phone</label><input name="phone" th:value="${customer.phone}" required>
  <label>New password (leave blank to keep the current one)</label><input type="password" name="newPassword" minlength="4">
  <button class="btn" type="submit">Save changes</button>
</form>
<aside class="side-art art-rings"><div class="cap"><h3>Your details, your way</h3><p>Keep your contact information up to date so vendors can reach you.</p></div></aside></div></div></body></html>
