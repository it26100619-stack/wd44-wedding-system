<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><title>Vendor sign in - Everlove</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}"><meta name="theme-color" content="#9d3d55"></head>
<body class="auth"><div class="box">
  <img th:src="@{/images/logo.png}" alt="Everlove">
  <h1>&hearts; Vendor sign in</h1>
  <div class="ok" th:if="${param.registered}">Account created. Please sign in.</div>
  <div class="error" th:if="${error}" th:text="${error}"></div>
  <form th:action="@{/vendor/login}" method="post">
    <label>Email</label><input type="email" name="email" required>
    <label>Password</label><input type="password" name="password" required>
    <button type="submit">Sign in</button>
  </form>
  <div class="links">New vendor? <a th:href="@{/vendor/register}">Register your business</a><br><a th:href="@{/}">&larr; Back to website</a></div>
</div></body></html>
