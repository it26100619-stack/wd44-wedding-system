<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><title>Choose your vendor - Everlove</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}"><meta name="theme-color" content="#9d3d55"></head><body>
<div th:replace="~{fragments :: nav('vendors')}"></div>
<section class="pagehead"><div class="wrap"><div class="eyebrow">STEP 1</div><h1>Choose your vendor</h1>
<p>Pick a category or search, then press <b>Book now</b> on the vendor you like.</p></div></section>
<div class="wrap">
  <form class="filters" method="get" th:action="@{/customer/dashboard}">
    <div class="pills">
      <a class="pill" th:classappend="${category == ''} ? 'on'" th:href="@{/customer/dashboard}">All</a>
      <a class="pill" th:each="c : ${categories}" th:classappend="${c == category} ? 'on'" th:href="@{/customer/dashboard(category=${c})}" th:text="${c}"></a>
    </div>
    <div class="search"><input type="hidden" name="category" th:value="${category}"><input name="q" th:value="${q}" placeholder="Search vendors or city"><button class="btn" type="submit">Search</button></div>
  </form>
  <div class="vgrid">
    <div class="vcard" th:each="v : ${vendors}">
      <div class="vthumb" th:classappend="'c-' + ${v.category}" th:text="${v.icon}"></div>
      <div class="vbody">
        <span class="tag" th:text="${v.category}"></span>
        <h3 th:text="${v.name}"></h3>
        <div class="muted"><span th:text="${v.city}"></span><span th:if="${v.reviewCount > 0}" th:text="' - ★ ' + ${#numbers.formatDecimal(v.rating,1,0)} + ' (' + ${v.reviewCount} + ')'"></span></div>
        <div class="vfoot"><div><small class="muted">From</small><br><b th:text="'LKR ' + ${#numbers.formatInteger(v.priceNumber,1,'COMMA')}"></b> <small class="muted" th:text="${v.unit}"></small></div>
        <a class="btn" th:href="@{/customer/book/{id}(id=${v.id})}">Book now</a></div>
      </div>
    </div>
  </div>
  <p class="empty" th:if="${#lists.isEmpty(vendors)}">No vendors match your search. Try another category.</p>
</div></body></html>
