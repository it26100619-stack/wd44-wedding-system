<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><title>Write a review - Everlove</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}"><meta name="theme-color" content="#9d3d55"></head><body>
<div th:replace="~{fragments :: nav('bookings')}"></div>
<section class="pagehead"><div class="wrap"><div class="eyebrow">REVIEW</div><h1 th:text="'Review ' + ${booking.vendorName}"></h1></div></section>
<div class="wrap"><div class="two">
<form class="panel" th:action="@{/customer/review}" method="post">
  <input type="hidden" name="bookingId" th:value="${booking.id}">
  <label>Rating</label><select name="rating"><option value="5">5 - Excellent</option><option value="4">4 - Very good</option><option value="3">3 - Good</option><option value="2">2 - Fair</option><option value="1">1 - Poor</option></select>
  <label>Your review</label><textarea name="comment" rows="4" required></textarea>
  <button class="btn" type="submit">Post review</button>
</form>
<div class="panel"><h3>What other couples said</h3>
  <p class="muted" th:if="${#lists.isEmpty(reviews)}">No reviews yet. Yours will be the first.</p>
  <div th:each="r : ${reviews}"><b th:text="${r.customerName} + ' - ' + ${r.rating} + '/5'"></b><p th:text="${r.comment}"></p></div></div>
</div></div></body></html>
