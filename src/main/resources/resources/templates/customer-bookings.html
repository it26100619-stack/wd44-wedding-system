<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><title>My bookings - Everlove</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}"><meta name="theme-color" content="#9d3d55"></head><body>
<div th:replace="~{fragments :: nav('bookings')}"></div>
<section class="pagehead"><div class="wrap">
  <div class="steps3"><div class="done">1. Choose vendor</div><div class="done">2. Date and guests</div><div th:classappend="${#lists.isEmpty(bookings)} ? '' : 'done'">3. Request sent</div></div>
  <h1>My bookings</h1></div></section>
<div class="wrap">
  <div class="ok" th:if="${param.sent}">Booking request sent. The vendor will accept or decline it soon.</div>
  <div class="panel"><table class="dark">
    <tr><th>Ref</th><th>Vendor</th><th>Wedding date</th><th>Guests</th><th>Total (LKR)</th><th>Status</th><th></th></tr>
    <tr th:each="b : ${bookings}">
      <td th:text="'#' + ${b.id}"></td><td th:text="${b.vendorName}"></td><td th:text="${b.date}"></td><td th:text="${b.guests}"></td>
      <td th:text="${#numbers.formatInteger(b.total,1,'COMMA')}"></td>
      <td><span class="badge" th:classappend="${b.status}" th:text="${b.status}"></span></td>
      <td><a th:if="${b.status == 'ACCEPTED' and !#lists.contains(reviewedIds, b.id)}" class="btn small" th:href="@{/customer/review/{id}(id=${b.id})}">Write review</a>
          <span th:if="${#lists.contains(reviewedIds, b.id)}" class="muted">Reviewed</span></td>
    </tr></table>
    <div class="empty" th:if="${#lists.isEmpty(bookings)}"><div class="ico">📅</div><p>You have no bookings yet.</p><a class="btn" th:href="@{/customer/dashboard}">Browse vendors</a></div>
  </div></div></body></html>
